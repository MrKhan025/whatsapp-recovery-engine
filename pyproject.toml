[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-recovery-engine"
version = "1.0.0"
description = "Offline-first WhatsApp backup analysis, chat inspection, media discovery, SHA-256 verification, and forensic reporting platform"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn>=0.27,<1.0", "reportlab>=4.0,<5.0"]

[project.scripts]
wtk = "wtk.cli:main"

[tool.setuptools.packages.find]
include = ["wtk*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
