name: CI — Tests & Security Audit (v2.0)

on:
  push:
    branches: ["main", "master", "feature/**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    name: Pytest, Bandit, Ruff & Dependency Audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Install Python & Virtualenv
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-pip
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify sample forensic workspace bootstrap
        run: |
          PYTHONPATH=. .venv/bin/python main.py init-sample

      - name: Run full Pytest suite (14 forensic & security categories)
        run: |
          PYTHONPATH=. .venv/bin/pytest -v

      - name: Run Ruff linter check
        run: |
          .venv/bin/ruff check wtk/ main.py || true

      - name: Run Bandit static security analysis (High/Medium severity)
        run: |
          .venv/bin/bandit -q -ll -r wtk

      - name: Run pip-audit dependency vulnerability check
        run: |
          .venv/bin/pip-audit -r requirements.txt --ignore-vuln GHSA-0000-0000-0000 || true
