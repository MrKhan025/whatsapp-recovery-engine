name: CI

on:
  push:
    branches: ["*"]
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: "."

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -f FETCH_HEAD

      - name: Set up Python virtual environment & install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/pip install -r requirements-dev.txt

      - name: Initialize synthetic sample data
        run: .venv/bin/python -m wtk init-sample

      - name: Run automated pytest suite
        run: .venv/bin/python -m pytest -q

      - name: Run Bandit security linter
        run: .venv/bin/bandit -q -r wtk

      - name: Run dependency vulnerability audit
        run: .venv/bin/pip-audit -r requirements.txt
